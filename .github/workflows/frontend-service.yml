name: Frontend Service CI

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
        description: "GHCR image name (e.g., frontend)"
      service-name:
        required: true
        type: string
        description: "Service name as in values.yaml (e.g., frontend)"
      chart-name:
        required: true
        type: string
        default: "demo-chart"
        description: "Chart name in values.yaml (namespace/chart context)"
      node-version:
        required: false
        type: string
        default: "24"
      manifests-repo:
        required: false
        type: string
        default: "deployments"
    secrets:
      GHCR_TOKEN:
        required: true
      MANIFESTS_REPO_TOKEN:
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ inputs.image-name }}

jobs:
  # ============================================================================
  # Job 1: Lint & Format Check (runs on both PR and push)
  # ============================================================================
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Biome lint
        run: npx biome check --max-diagnostics=500 src

      - name: Run Prettier check
        run: npx prettier --check src

      - name: Remove unused CSS
        run: npx purgecss --config purgecss.config.js --output src/

  # ============================================================================
  # Job 2: Unit & Component Tests (runs on both PR and push)
  # ============================================================================
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-format

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test:coverage

  # ============================================================================
  # Job 3: Build & Push to GHCR (only on push, not on PR)
  # ============================================================================
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs:
      - lint-and-format
      - unit-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "image_id=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image_id }}:${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image_id }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Add semver tag (if release tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image_id }}:${{ github.ref_name }}
          cache-from: type=gha

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image_id }}:${{ steps.meta.outputs.short_sha }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-results.sarif"

  # ============================================================================
  # Job 4: Update Manifests (only on push to main or release tags)
  # ============================================================================
  update-manifests:
    name: Update Manifests
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Extract tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == "refs/tags/v"* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
            echo "tag=$SHORT_SHA" >> $GITHUB_OUTPUT
          fi

      - name: Checkout deployments repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ inputs.manifests-repo }}
          token: ${{ secrets.MANIFESTS_REPO_TOKEN }}
          ref: main

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update values.yaml
        env:
          NEW_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          yq eval \
            '(.${{ inputs.chart-name }}.${{ inputs.service-name }}.tag) |= env.NEW_TAG' \
            -i infra/charts/platform/values.yaml
      - name: Check if changes exist
        id: diff
        run: |
          if git diff --exit-code infra/charts/platform/values.yaml; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push (if changes exist)
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/charts/platform/values.yaml
          git commit -m "ci: update frontend to ${{ steps.tag.outputs.tag }} (triggered by ${{ github.repository }}@${{ github.sha }})"
          git push origin main
