name: Python Service CI

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
        description: "Service name as in values.yaml (e.g., backend1)"
      image-name:
        required: true
        type: string
        description: "GHCR image name (usually same as service-name)"
      chart-name:
        required: true
        type: string
        default: "demo-chart"
        description: "Chart name in values.yaml (namespace/chart context)"
      manifests-repo:
        required: true
        type: string
        description: "Repo name with manifests (owner is taken from repository_owner)"
      values-file:
        required: true
        type: string
        description: "Path to values.yaml inside manifests repo"
      working-directory:
        required: false
        type: string
        default: "."
        description: "Working directory for the service code"
      python-version:
        required: false
        type: string
        default: "3.13"
  
    secrets:
      GHCR_TOKEN:
        required: true
      MANIFESTS_REPO_TOKEN:
        required: true
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ inputs.image-name }}

jobs:
  # ============================================================================
  # Job 1: Lint & Type Checking (runs on both PR and push)
  # ============================================================================
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt 2>/dev/null || true

      - name: Run Ruff lint
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

      - name: Run mypy type checking
        run: mypy .

      - name: Run Bandit security scan
        run: bandit -r src/ -ll || true  # Info/low-level issues don't fail

  # ============================================================================
  # Job 2: Unit Tests (runs on both PR and push)
  # ============================================================================
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt 2>/dev/null || true

      - name: Run unit tests
        run: pytest tests/unit -v --cov=src --cov-report=term-missing

  # ============================================================================
  # Job 3: Integration Tests (only on push, requires database)
  # ============================================================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    if: github.event_name == 'push'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt 2>/dev/null || true

      - name: Start test services
        run: docker compose -f tests/docker-compose.test.yaml up -d --wait --wait-timeout 120

      - name: Run integration tests
        run: pytest tests/integrations -v --timeout=60

      - name: Dump service logs on failure
        if: failure()
        run: docker compose -f tests/docker-compose.test.yaml logs --no-color

      - name: Stop test services
        if: always()
        run: docker compose -f tests/docker-compose.test.yaml down -v --remove-orphans
  # ============================================================================
  # Job 4: Build & Push to GHCR (only on push, not on PR)
  # ============================================================================
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs:
      - lint-and-typecheck
      - unit-test
      - integration-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "image_id=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT

      - name: Build and push (for push to main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.working-directory }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image_id }}:${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image_id }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Add semver tag (if release tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.working-directory }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image_id }}:${{ github.ref_name }}
          cache-from: type=gha

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image_id }}:${{ steps.meta.outputs.short_sha }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-results.sarif" # Для закрытых репозиториев

  # ============================================================================
  # Job 5: Update Manifests (only on push to main)
  # ============================================================================
  update-manifests:
    name: Update Manifests
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Extract tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == "refs/tags/v"* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
            echo "tag=$SHORT_SHA" >> $GITHUB_OUTPUT
          fi

      - name: Checkout deployments repo
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/${{ inputs.manifests-repo }}
          token: ${{ secrets.MANIFESTS_REPO_TOKEN }}
          ref: main

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update values.yaml
        env:
          NEW_TAG: ${{ steps.tag.outputs.tag }}
          SERVICE_NAME: ${{ inputs.service-name }}
          VALUES_FILE: ${{ inputs.values-file }}
          CHART_NAME: ${{ inputs.chart-name }}
        run: |
          yq eval \
            '(.[strenv(CHART_NAME)].backends[] | select(.name == strenv(SERVICE_NAME)) | .tag) |= strenv(NEW_TAG)' \
            -i "$VALUES_FILE"
  
      - name: Check if changes exist
        id: diff
        env:
          VALUES_FILE: ${{ inputs.values-file }}
        run: |
          if git diff --exit-code "$VALUES_FILE"; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
  
      - name: Commit and push (if changes exist)
        if: steps.diff.outputs.changed == 'true'
        env:
          VALUES_FILE: ${{ inputs.values-file }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$VALUES_FILE"
          git commit -m "ci: update ${{ inputs.service-name }} to ${{ steps.tag.outputs.tag }} (triggered by ${{ github.repository }}@${{ github.sha }})"
          git push origin main
