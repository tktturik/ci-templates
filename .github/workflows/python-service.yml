# tktturik/ci-templates/.github/workflows/python-service.yml
# Reusable workflow для Python-сервисов
name: Python Service CI

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
        description: "Service name as in values.yaml (e.g., backend1)"
      image-name:
        required: true
        type: string
        description: "GHCR image name (usually same as service-name)"
      working-directory:
        required: false
        type: string
        default: "."
        description: "Working directory for the service code"
      python-version:
        required: false
        type: string
        default: "3.13"
      manifests-repo:
        required: false
        type: string
        default: "deployments"    
    secrets:
      GHCR_TOKEN:
        required: true
      MANIFESTS_REPO_TOKEN:
        required: true
    # Опциональные секреты - могут быть или не быть
      CUSTOM_ENV_VARS:  # JSON со всеми доп переменными
        required: false
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ inputs.image-name }}

jobs:
  # ============================================================================
  # Job 1: Lint & Type Checking (runs on both PR and push)
  # ============================================================================
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt 2>/dev/null || true

      - name: Run Ruff lint
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

      - name: Run mypy type checking
        run: mypy .

      - name: Run Bandit security scan
        run: bandit -r src/ -ll || true  # Info/low-level issues don't fail

  # ============================================================================
  # Job 2: Unit Tests (runs on both PR and push)
  # ============================================================================
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt 2>/dev/null || true

      - name: Run unit tests
        run: pytest tests/unit-tests -v --cov=src --cov-report=term-missing

  # ============================================================================
  # Job 3: Integration Tests (only on push, requires database)
  # ============================================================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    if: github.event_name == 'push'
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DB_USER: testuser
      DB_PASSWORD: 2525
      DB_PORT: 5432
      DB_NAME: testdb
      CUSTOM_VARS: ${{ secrets.CUSTOM_ENV_VARS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt 2>/dev/null || true

      - name: Parse custom env vars
        run: |
          python3 << 'EOF'
          import json
          import os
          
          custom_vars = os.getenv('CUSTOM_VARS', '{}')
          try:
              vars_dict = json.loads(custom_vars)
              for key, value in vars_dict.items():
                  with open(os.environ['GITHUB_ENV'], 'a') as f:
                      f.write(f"{key}={value}\n")
          except json.JSONDecodeError:
              print("Warning: CUSTOM_ENV_VARS не валидный JSON")
          EOF


      - name: Run integration tests
        run: pytest tests/integrations -v --timeout=60

  # ============================================================================
  # Job 4: Build & Push to GHCR (only on push, not on PR)
  # ============================================================================
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs:
      - lint-and-typecheck
      - unit-test
      - integration-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "image_id=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT

      - name: Build and push (for push to main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.working-directory }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image_id }}:${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image_id }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Add semver tag (if release tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.working-directory }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image_id }}:${{ github.ref_name }}
          cache-from: type=gha

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image_id }}:${{ steps.meta.outputs.short_sha }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # ============================================================================
  # Job 5: Update Manifests (only on push to main)
  # ============================================================================
  update-manifests:
    name: Update Manifests
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Extract tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == "refs/tags/v"* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
            echo "tag=$SHORT_SHA" >> $GITHUB_OUTPUT
          fi

      - name: Checkout deployments repo
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/${{ inputs.manifests-repo }}
          token: ${{ secrets.MANIFESTS_REPO_TOKEN }}
          ref: main

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update values.yaml
        env:
          NEW_TAG: ${{ steps.tag.outputs.tag }}
          SERVICE_NAME: ${{ inputs.service-name }}
        run: |
          # Для Python-сервисов, обновляем массив backends[] по имени сервиса
          yq eval \
            '(.demo-chart.backends[] | select(.name == env.SERVICE_NAME) | .tag) |= env.NEW_TAG' \
            -i infra/charts/platform/values.yaml

      - name: Check if changes exist
        id: diff
        run: |
          if git diff --exit-code infra/charts/platform/values.yaml; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push (if changes exist)
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/charts/platform/values.yaml
          git commit -m "ci: update ${{ inputs.service-name }} to ${{ steps.tag.outputs.tag }} (triggered by ${{ github.repository }}@${{ github.sha }})"
          git push origin main
